version: '3.9'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: archly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archly-network
    restart: unless-stopped

  # ============================================================================
  # Collaboration Server (Yjs WebSocket)
  # ============================================================================
  collab:
    build:
      context: ./services/collab
      dockerfile: Dockerfile
    container_name: archly-collab
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      YJS_HOST: 0.0.0.0
      YJS_PORT: 1234
      YJS_LOG_LEVEL: ${YJS_LOG_LEVEL:-info}
      YJS_PERSISTENCE_ENABLED: ${YJS_PERSISTENCE_ENABLED:-true}
      YJS_PERSISTENCE_DB_URL: ${DATABASE_URL}
      YJS_SNAPSHOT_INTERVAL: ${YJS_SNAPSHOT_INTERVAL:-3600000}
      YJS_DOC_RETENTION_DAYS: ${YJS_DOC_RETENTION_DAYS:-90}
      YJS_MAX_CLIENTS_PER_DOC: ${YJS_MAX_CLIENTS_PER_DOC:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - archly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Frontend (Next.js Platform Layer)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: archly-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      collab:
        condition: service_healthy
    networks:
      - archly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Reverse Proxy (Nginx, optional)
  # ============================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: archly-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - collab
  #   networks:
  #     - archly-network
  #   restart: unless-stopped

networks:
  archly-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
