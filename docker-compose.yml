version: '3.9'

# ============================================================================
# UNIFIED DOCKER COMPOSE — archly.cloud
# ============================================================================
# Single orchestration for all services:
#  - PostgreSQL database (port 5432)
#  - Yjs collaboration server (port 1234)
#  - Next.js frontend (port 3002)
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose down               # Stop all services
#   docker-compose logs -f frontend   # Follow logs
#
# Environment: Copy .env.template to .env and fill in values
# ============================================================================

services:
  # ============================================================================
  # Caddy Reverse Proxy (Port 80/443)
  # ============================================================================
  # Routes all HTTP/HTTPS traffic to internal services.
  # Handles WebSocket upgrades for collaboration server.
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: archly-caddy
    environment:
      DOMAIN: ${CADDY_DOMAIN:-archly.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - collab
    networks:
      - archly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # PostgreSQL Database (Primary data store)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: archly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - archly-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Yjs Collaboration Server (WebSocket, port 1234)
  # ============================================================================
  # Real-time sync for concurrent editing.
  # Persists document state to PostgreSQL.
  # ============================================================================
  collab:
    build:
      context: ./services/collab
      dockerfile: Dockerfile.${NODE_ENV:-production}
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: archly-collab
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      YJS_HOST: 0.0.0.0
      YJS_PORT: 1234
      YJS_LOG_LEVEL: ${YJS_LOG_LEVEL:-info}
      YJS_PERSISTENCE_ENABLED: ${YJS_PERSISTENCE_ENABLED:-true}
      YJS_PERSISTENCE_DB_URL: ${DATABASE_URL}
      YJS_SNAPSHOT_INTERVAL: ${YJS_SNAPSHOT_INTERVAL:-3600000}
      YJS_DOC_RETENTION_DAYS: ${YJS_DOC_RETENTION_DAYS:-90}
      YJS_MAX_CLIENTS_PER_DOC: ${YJS_MAX_CLIENTS_PER_DOC:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - archly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Next.js Frontend (Port 3002)
  # ============================================================================
  # Platform layer: dashboard, editor, marketplace, API routes.
  # Built as production image or dev image based on NODE_ENV.
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.${NODE_ENV:-production}
      args:
        NODE_ENV: ${NODE_ENV:-production}
      target: ${NODE_ENV:-production}
    container_name: archly-frontend
    environment:
      # App configuration
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}

      # Database
      DATABASE_URL: ${DATABASE_URL}

      # Authentication
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}

      # Storage (R2)
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # Feature flags
      FEATURE_MARKETPLACE_ENABLED: ${FEATURE_MARKETPLACE_ENABLED:-true}
      FEATURE_CLONE_DUPLICATION: ${FEATURE_CLONE_DUPLICATION:-true}
      FEATURE_REAL_TIME_SYNC: ${FEATURE_REAL_TIME_SYNC:-true}
      FEATURE_PRESENCE_CURSORS: ${FEATURE_PRESENCE_CURSORS:-true}
      FEATURE_SPATIAL_COMMENTS: ${FEATURE_SPATIAL_COMMENTS:-false}

    ports:
      - "3002:3002"
    volumes:
      # Development only: hot reload
      - .:/app:cached
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      collab:
        condition: service_started
    networks:
      - archly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  archly-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
