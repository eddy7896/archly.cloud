version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: archly-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-archly}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archly"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archly-network-dev
    restart: unless-stopped

  collab:
    build:
      context: ./services/collab
      dockerfile: Dockerfile.dev
    container_name: archly-collab-dev
    environment:
      NODE_ENV: development
      YJS_HOST: 0.0.0.0
      YJS_PORT: 1234
      YJS_LOG_LEVEL: debug
      YJS_PERSISTENCE_ENABLED: true
      YJS_PERSISTENCE_DB_URL: postgresql://archly:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/archly
      LOG_LEVEL: debug
    ports:
      - "1234:1234"
    volumes:
      - ./services/collab/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - archly-network-dev
    restart: unless-stopped
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: archly-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:3002/api
      NEXT_PUBLIC_WS_URL: ws://localhost:1234
      NEXT_PUBLIC_R2_PUBLIC_URL: https://cdn.archly.cloud
      DATABASE_URL: postgresql://archly:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/archly
      BETTER_AUTH_SECRET: dev_secret_key_at_least_32_chars_long
      BETTER_AUTH_URL: http://localhost:3002
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      collab:
        condition: service_started
    networks:
      - archly-network-dev
    restart: unless-stopped
    command: npm run dev

networks:
  archly-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
